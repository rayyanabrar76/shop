<!--
  ShopFlow's mark: a market awning.

  Chosen over a shopping bag because that is Shopify's, and over a letterform
  because "S." was doing nothing a thousand other products do not. An awning is
  the one piece of shop furniture that is not a bag, and its scalloped hem gives
  the mark movement, which is the half of the name that means anything.

  Monochrome by construction, matching the wordmark: white on #212121, no
  colour anywhere. Drawn rather than generated so the curves stay exact — this
  is checked at 16px, where the ring and the silhouette both still read.

  Geometry notes for anyone adjusting it:
  - The hem arcs travel right-to-left, so they need sweep-flag 1 to hang
    downward. Flip it and they curve up into the canopy instead.
  - The dark path hollows the canopy but stops above the hem, which is what
    keeps the skirt solid rather than outlining the scallops too.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The disc is the icon: no square behind it, so the corners stay
       transparent and it sits as a circle on any tab colour. -->
  <circle cx="256" cy="256" r="250" fill="#212121"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#ffffff" stroke-width="12"/>

  <!-- Canopy: domed top, straight sides, scalloped hem. -->
  <path fill="#ffffff" d="M120 356 L120 300 A136 96 0 0 1 392 300 L392 356
    A34 34 0 0 1 324 356 A34 34 0 0 1 256 356
    A34 34 0 0 1 188 356 A34 34 0 0 1 120 356 Z"/>

  <!-- Hollows the canopy, stopping short of the hem. -->
  <path fill="#212121" d="M158 336 L158 306 A98 66 0 0 1 354 306 L354 336 Z"/>

  <!-- Valance rail, sitting on the apex. -->
  <rect x="156" y="168" width="200" height="48" rx="24" fill="#ffffff"/>
</svg>
